name: Build LazyNest

# Pushing a version tag (v2.4, v2.5, …) builds the app for Windows, Apple
# Silicon and Intel Mac, then publishes them on the GitHub release for that
# tag. Can also be run by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pillow
      - name: Make the icon
        run: python -c "from PIL import Image; img=Image.open('icon.png'); img.save('icon.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(32,32),(16,16)])"
      - name: Build LazyNest.exe
        run: >
          python -m PyInstaller --onefile --windowed --name LazyNest
          --icon icon.ico --add-data "icon.png;."
          --hidden-import ezdxf --hidden-import ezdxf.fonts
          --hidden-import shapely --hidden-import shapely.geometry
          --hidden-import shapely.affinity --hidden-import shapely.ops
          --hidden-import openpyxl --hidden-import numpy
          --hidden-import pyclipper --hidden-import PIL
          --collect-all PyQt6 --collect-all ezdxf --collect-all shapely
          app.py
      - name: Name it after the version
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#refs/tags/}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || v="dev"
          mv dist/LazyNest.exe "dist/LazyNest-$v-Windows.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: LazyNest-Windows
          path: dist/LazyNest-*-Windows.exe
      - name: Publish to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # each platform publishes as soon as it is built, so a slow runner
          # for one OS never holds up the others
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "LazyNest $GITHUB_REF_NAME" \
              --notes-file Release/RELEASE_NOTES.md || true
          gh release upload "$GITHUB_REF_NAME" dist/LazyNest-*-Windows.exe --clobber
          gh release edit "$GITHUB_REF_NAME" --notes-file Release/RELEASE_NOTES.md

  macos:
    # Apple Silicon only: GitHub has retired its Intel macOS runners, so an
    # Intel job would sit queued until it is cancelled. Intel Macs can run
    # LazyNest from source (see the README).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pillow
      - name: Build LazyNest.app
        run: python -m PyInstaller --noconfirm LazyNest.spec
      - name: Zip the app
        run: |
          v="${GITHUB_REF_NAME#refs/tags/}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || v="dev"
          ditto -c -k --sequesterRsrc --keepParent dist/LazyNest.app \
                "LazyNest-$v-macOS-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: LazyNest-macOS-arm64
          path: LazyNest-*-macOS-*.zip
      - name: Publish to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # each platform publishes as soon as it is built, so a slow runner
          # for one OS never holds up the others
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "LazyNest $GITHUB_REF_NAME" \
              --notes-file Release/RELEASE_NOTES.md || true
          gh release upload "$GITHUB_REF_NAME" LazyNest-*-macOS-arm64.zip --clobber
          gh release edit "$GITHUB_REF_NAME" --notes-file Release/RELEASE_NOTES.md
